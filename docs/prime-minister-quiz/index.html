<style>
/* Layout: one card per question, portrait left / choices right, stacking on phones.
   Palette: 議事堂の御影石のような灰と、赤絨毯の臙脂。 */
:root {
  --bg: #efede8;
  --paper: #fbfaf7;
  --fg: #22211f;
  --muted: #6d6a63;
  --line: #d6d2c9;
  --accent: #8e1d2c;
  --accent-ink: #fff7f5;
  --good: #1f6b3a;
  --good-bg: #e6f2e9;
  --bad: #9a2a1f;
  --bad-bg: #f8e7e3;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --paper: #262421; --fg: #ebe7df; --muted: #a39e93; --line: #3d3a35;
    --accent: #c9475a; --accent-ink: #fff7f5;
    --good: #7fcf97; --good-bg: #1d3326; --bad: #ef8a7c; --bad-bg: #3a211d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --paper: #262421; --fg: #ebe7df; --muted: #a39e93; --line: #3d3a35;
  --accent: #c9475a; --accent-ink: #fff7f5;
  --good: #7fcf97; --good-bg: #1d3326; --bad: #ef8a7c; --bad-bg: #3a211d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 5vw, 38px); line-height: 1.25; margin: 0; text-wrap: balance; }
h1 small { display: block; font-size: .5em; font-weight: 500; color: var(--muted); margin-top: 4px; }

.status { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status b { color: var(--fg); font-weight: 700; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
.stars { letter-spacing: .1em; color: var(--accent); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 22px; }
@media (max-width: 600px) { .card { grid-template-columns: 1fr; } }
.photo { display: grid; gap: 8px; }
.photo img { width: 100%; max-width: 240px; aspect-ratio: 318 / 410; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--line); display: block; margin: 0 auto; }
.photo figcaption { font-size: 12px; color: var(--muted); text-align: center; }
.q { display: grid; gap: 14px; align-content: start; min-width: 0; }
.q h2 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; }
.q .lv { font-size: 13px; color: var(--muted); }
.choices { display: grid; gap: 10px; }
.choice {
  font: inherit; text-align: left; cursor: pointer; width: 100%;
  background: var(--paper); color: var(--fg); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 17px;
}
.choice .k { font-family: var(--font-display); font-weight: 700; color: var(--accent); width: 1.4em; flex: none; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice:disabled { cursor: default; }
.choice.correct { background: var(--good-bg); border-color: var(--good); }
.choice.wrong { background: var(--bad-bg); border-color: var(--bad); }
.choice.dim { opacity: .55; }
.result { display: grid; gap: 6px; padding: 12px 14px; border-radius: 8px; border-left: 4px solid var(--line); background: var(--bg); font-size: 15px; }
.result.ok { border-left-color: var(--good); }
.result.ng { border-left-color: var(--bad); }
.result .verdict { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.result.ok .verdict { color: var(--good); }
.result.ng .verdict { color: var(--bad); }
.result .name { font-weight: 700; }
.btn { font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 12px 22px; font-size: 16px; justify-self: start; }
.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }

.final { display: grid; gap: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 26px 22px; }
.final .score { font-family: var(--font-display); font-size: clamp(40px, 10vw, 64px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.final .score span { font-size: .4em; color: var(--muted); font-weight: 500; }
.final .rank { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--accent); }
.review { display: grid; gap: 6px; font-size: 14px; list-style: none; padding: 0; margin: 0; }
.review li { display: grid; grid-template-columns: 1.6em 1.2em 1fr; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
.review .mk { font-weight: 700; }
.review .ok { color: var(--good); } .review .ng { color: var(--bad); }
.review .ans { color: var(--muted); }
footer { font-size: 12px; color: var(--muted); line-height: 1.6; }
footer a { color: inherit; }
footer .sig { font-weight: 700; color: var(--fg); font-size: 13px; margin-bottom: 4px; }
</style>

  const qs = [];
  for (let d = 1; d <= 5; d++) {
    const picks = shuffle(POOL.filter(p => p.d === d)).slice(0, 2);
    picks.forEach(p => {
      const others = shuffle(POOL.filter(x => x.e === p.e && x.name !== p.name)).slice(0, 2).map(x => x.name);
      qs.push({ img: img(p.n), answer: p.name, info: p.info, fact: p.fact, d, choices: shuffle([p.name, ...others]) });
    });
  }
  return qs;
}

function render() {
  const i = state.i, qs = state.qs;
  if (i >= qs.length) return renderFinal();
  const q = qs[i];
  $("card").hidden = false; $("final").hidden = true;
  $("qno").textContent = i + 1;
  $("score").textContent = state.score;
  $("stars").textContent = "★".repeat(q.d) + "☆".repeat(5 - q.d);
  $("barfill").style.width = (i / qs.length * 100) + "%";
  $("lv").textContent = `難易度 ${LEVELS[q.d - 1]}`;
  $("photo").src = q.img;
  const box = $("choices"); box.innerHTML = "";
  const done = state.answered[i];
  q.choices.forEach((name, k) => {
    const b = document.createElement("button");
    b.className = "choice"; b.type = "button"; b.id = `c${i}_${k}`;
    b.innerHTML = `<span class="k">${"ABC"[k]}</span><span>${name}</span>`;
    if (done) {
      b.disabled = true;
      if (name === q.answer) b.classList.add("correct");
      else if (name === done.picked) b.classList.add("wrong");
      else b.classList.add("dim");
    } else {
      b.addEventListener("click", () => answer(name));
    }
    box.appendChild(b);
  });
  const r = $("result");
  if (done) {
    r.hidden = false; r.className = "result " + (done.ok ? "ok" : "ng");
    $("verdict").textContent = done.ok ? "正解！" : "残念、不正解";
    $("aname").textContent = q.answer; $("ainfo").textContent = q.info; $("afact").textContent = q.fact;
    $("next").hidden = false;
    $("next").textContent = i === qs.length - 1 ? "結果を見る" : "次の問題へ";
  } else { r.hidden = true; $("next").hidden = true; }
}

function answer(name) {
  const q = state.qs[state.i];
  const ok = name === q.answer;
  state.answered[state.i] = { picked: name, ok };
  if (ok) state.score++;
  render();
  $("next").focus();
}

function rankText(s) {
  if (s === 10) return "全問正解！ 総理官邸の記者クラブでも通用します。";
  if (s >= 8) return "上級者。戦前の宰相まで押さえています。";
  if (s >= 6) return "なかなかの政治通。戦前の顔ぶれが伸びしろです。";
  if (s >= 4) return "現代の総理はばっちり。あとは昭和・明治へ。";
  return "まずは直近の総理から覚えていきましょう。";
}

function renderFinal() {
  $("card").hidden = true; $("final").hidden = false;
  $("barfill").style.width = "100%";
  $("qno").textContent = 10; $("score").textContent = state.score;
  $("fscore").textContent = state.score;
  $("frank").textContent = rankText(state.score);
  const ul = $("review"); ul.innerHTML = "";
  state.qs.forEach((q, i) => {
    const a = state.answered[i];
    const li = document.createElement("li");
    li.innerHTML = `<span>${i + 1}.</span><span class="mk ${a.ok ? "ok" : "ng"}">${a.ok ? "○" : "×"}</span><span>${q.answer} <span class="ans">${q.info}${a.ok ? "" : "／あなたの回答: " + a.picked}</span></span>`;
    ul.appendChild(li);
  });
}

$("next").addEventListener("click", () => { state.i++; render(); window.scrollTo({ top: 0 }); });
$("again").addEventListener("click", () => { state = { i: 0, score: 0, answered: [], qs: makeQuiz() }; render(); });

function start(saved) {
  if (saved && saved.qs && saved.qs.length === 10) state = saved;
  else state.qs = makeQuiz();
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
